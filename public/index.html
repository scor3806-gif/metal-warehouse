<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Склад металла — распродажа</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .quantity-input:focus { outline: 2px solid #3b82f6; }
    tr:hover { background-color: #f8fafc; }
    .filter-input {
      width: 100%;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      color: #1e293b;
    }
    .filter-input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Шапка -->
  <header class="bg-slate-800 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold">Склад металла</h1>
        <p class="text-slate-300 text-sm">Только позиции на распродажу</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="downloadBackup()" 
                class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2.5 rounded-lg font-medium transition text-sm">
          Скачать бэкап
        </button>
        <button onclick="document.getElementById('backupFile').click()" 
                class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2.5 rounded-lg font-medium transition text-sm">
          Загрузить бэкап
        </button>
        <input type="file" id="backupFile" accept=".json" class="hidden" onchange="uploadBackup(event)">
        <button onclick="openAddModal()" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition flex items-center justify-center gap-2">
          <span class="text-xl leading-none">+</span> Добавить
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Таблица -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-700 text-white text-sm">
            <tr>
              <th class="px-3 py-3 font-medium">Тип</th>
              <th class="px-3 py-3 font-medium">Марка</th>
              <th class="px-3 py-3 font-medium">Диаметр</th>
              <th class="px-3 py-3 font-medium">Длина</th>
              <th class="px-3 py-3 font-medium w-28">Количество</th>
              <th class="px-3 py-3 font-medium">Комментарий</th>
              <th class="px-3 py-3 font-medium w-16 text-center">Действия</th>
            </tr>
            <!-- Строка фильтров -->
            <tr class="bg-slate-600">
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-type" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-grade" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-size1" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-size2" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-quantity" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2">
                <input type="text" class="filter-input" id="filter-comment" placeholder="Фильтр..." oninput="filterItems()">
              </th>
              <th class="px-2 py-2 text-center">
                <button onclick="clearFilters()" class="text-xs text-slate-300 hover:text-white underline">Сброс</button>
              </th>
            </tr>
          </thead>
          <tbody id="itemsTable" class="divide-y divide-gray-200 text-sm">
          </tbody>
        </table>
      </div>

      <div id="emptyState" class="hidden py-16 text-center text-gray-500">
        <p class="text-lg">Позиций не найдено</p>
        <p class="mt-2">Попробуйте изменить фильтры или добавьте новую позицию</p>
      </div>
    </div>

    <p class="mt-4 text-center text-gray-500 text-sm">
      Данные сохраняются автоматически. Любой может менять количество.
    </p>
  </main>

  <!-- Модалка добавления -->
  <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
      <div class="px-6 py-4 border-b flex justify-between items-center">
        <h2 class="text-lg font-bold">Новая позиция</h2>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>
      <form id="addForm" class="p-6 space-y-4" onsubmit="addItem(event)">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Тип *</label>
          <input type="text" id="type" required placeholder="Круг бронзовый"
                 class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Марка</label>
          <input type="text" id="grade" placeholder="Браж 9-4"
                 class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Диаметр</label>
            <input type="text" id="size1" placeholder="25мм"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Длина</label>
            <input type="text" id="size2" placeholder="50мм"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Количество *</label>
          <input type="number" id="quantity" required min="0" value="0"
                 class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Комментарий</label>
          <input type="text" id="comment" placeholder="Любой текст"
                 class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeAddModal()"
                  class="flex-1 px-4 py-2.5 border rounded-lg hover:bg-gray-50">Отмена</button>
          <button type="submit"
                  class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Добавить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
